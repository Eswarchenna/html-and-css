<!DOCTYPE html>
<html>

<head>
    <title>Gap Property</title>

    <style>

        .appear {
            display: flex;
            gap: 20px;
            background: lightblue;
            padding: 10px;
        }

        .appear p {
            background: orange;
            padding: 10px;
        }

    </style>
</head>

<body>

    <strong>Gap:</strong>

    <div class="appear">
        <p>Explanation:</p>
        <p>Adds spacing.</p>
    </div>

    <br>

    <strong>Expected Output:</strong>

    <p>20px space appears between both paragraphs.</p>

</body>

</html>
